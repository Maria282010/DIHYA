<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

.hero {
  height: 100vh;
  position: relative;
  overflow: hidden;
}

.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.2),
    rgba(0,0,0,0.85)
  );
}

.logo {
  position: absolute;
  top: 30px;
  width: 100%;
  text-align: center;
  color: #d4af65;
  font-size: 32px;
  letter-spacing: 8px;
  font-weight: bold;
}

.symbol {
  font-size: 25px;
}

.content {
  position: absolute;
  bottom: 45px;
  width: 100%;
  text-align: center;
  padding: 20px;
}

.small {
  color: #d4af65;
  letter-spacing: 4px;
  font-size: 12px;
}

h1 {
  font-size: 40px;
  letter-spacing: 5px;
  margin: 12px 0;
}

.content p {
  color: #eee;
}

button {
  padding: 14px 30px;
  background: #d4af65;
  color: #080808;
  border: none;
  font-weight: bold;
  letter-spacing: 2px;
  cursor: pointer;
}

.collection {
  padding: 50px 15px;
  text-align: center;
}

.collection h2 {
  color: #d4af65;
  letter-spacing: 4px;
}

.product {
  max-width: 420px;
  margin: 30px auto;
  background: #111;
  padding-bottom: 25px;
}

.product img {
  width: 100%;
  display: block;
}

.product h3 {
  font-size: 20px;
  letter-spacing: 2px;
}

.price {
  color: #d4af65;
  font-size: 20px;
  font-weight: bold;
}

.sizes {
  color: #bbb;
  margin: 15px;
}

.add {
  background: #d4af65;
  color: #080808;
  padding: 13px 25px;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

.add:hover,
button:hover {
  opacity: 0.85;
}
</style>
</head>

<body>

<section class="hero">

  <img src="Screenshot_20260827_210710_edit_97270665629819.jpg">

  <div class="overlay"></div>

  <div class="logo">
    <div class="symbol">ⵣ</div>
    DIHYA
  </div>

  <div class="content">
    <div class="small">AMAZIGH LUXURY</div>

    <h1>NEW DROP</h1>

    <p>Wear your expression.</p>

    <button>EXPLORE COLLECTION</button>
  </div>

</section>

<section class="collection">

  <h2>THE COLLECTION</h2>

  <div class="product">

    <img src="Screenshot_20260827_210710_edit_97270665629819.jpg">

    <h3>DIHYA HERITAGE SET</h3>

    <div class="price">300 MAD</div>

    <div class="sizes">
      S &nbsp; M &nbsp; L &nbsp; XL
    </div>

    <button class="add">ADD TO BAG</button>

  </div>

</section>

</body>
</html>
