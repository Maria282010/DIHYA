<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

.hero {
  height: 100vh;
  position: relative;
  overflow: hidden;
}

.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.25),
    rgba(0,0,0,0.15),
    rgba(0,0,0,0.85)
  );
}

.logo {
  position: absolute;
  top: 35px;
  width: 100%;
  text-align: center;
  color: #d4af65;
  font-size: 32px;
  letter-spacing: 8px;
  font-weight: bold;
}

.symbol {
  font-size: 25px;
  margin-bottom: 5px;
}

.content {
  position: absolute;
  bottom: 55px;
  width: 100%;
  text-align: center;
  padding: 20px;
}

.small {
  color: #d4af65;
  letter-spacing: 5px;
  font-size: 13px;
}

h1 {
  font-size: 42px;
  letter-spacing: 6px;
  margin: 12px 0;
}

p {
  color: #eee;
  font-size: 15px;
}

button {
  margin-top: 18px;
  padding: 14px 30px;
  background: #d4af65;
  color: #080808;
  border: none;
  font-weight: bold;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<section class="hero">

  <img src="Screenshot_20260827_210710_edit_97270665629819.jpg">

  <div class="overlay"></div>

  <div class="logo">
    <div class="symbol">ⵣ</div>
    DIHYA
  </div>

  <div class="content">
    <div class="small">AMAZIGH LUXURY</div>

    <h1>NEW DROP</h1>

    <p>Wear your expression.</p>

    <button>COMING SOON</button>
  </div>

</section>

</body>
</html>
